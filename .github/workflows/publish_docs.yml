name: Publish Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy with the workflow's own token rather than a personal GH_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package and the docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Check the generated pages are current
        run: |
          python tools/gen_command_rst.py --check
          python docs/gen_param_block.py --check
          python docs/check_docs.py

      - name: Build
        run: make -C docs clean html SPHINXOPTS="-W --keep-going"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
